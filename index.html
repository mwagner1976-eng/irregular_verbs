<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irregular Verbs Trainer</title>

<style>
body {font-family: Arial; background:#f1f5f9; margin:0; padding:16px;}
.card {background:white; padding:16px; border-radius:16px; margin-bottom:12px;}
.tiles {display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.tile {padding:16px; border-radius:12px; border:1px solid #ccc; font-weight:bold; cursor:pointer;}
.tile.selected {background:#0f172a; color:white;}
.stat {display:inline-block; margin-right:15px;}
</style>
</head>

<body>

<div class="card">
<h2 id="verb"></h2>
<div class="stat">Punkte: <span id="score">0</span></div>
<div class="stat">Highscore: <span id="highscore">0</span></div>
<div class="stat">Runde: <span id="round">1</span>/10</div>
</div>

<div class="tiles" id="tiles"></div>

<div class="card" id="result"></div>

<script>
const VERBS = [
{de:"sein", i:"be", p:"was", pp:"been"},
{de:"gehen", i:"go", p:"went", pp:"gone"},
{de:"sehen", i:"see", p:"saw", pp:"seen"},
{de:"nehmen", i:"take", p:"took", pp:"taken"},
{de:"kommen", i:"come", p:"came", pp:"come"},
{de:"finden", i:"find", p:"found", pp:"found"},
{de:"denken", i:"think", p:"thought", pp:"thought"},
{de:"machen", i:"make", p:"made", pp:"made"},
{de:"geben", i:"give", p:"gave", pp:"given"},
{de:"wissen", i:"know", p:"knew", pp:"known"},
{de:"kaufen", i:"buy", p:"bought", pp:"bought"},
{de:"bringen", i:"bring", p:"brought", pp:"brought"},
{de:"fühlen", i:"feel", p:"felt", pp:"felt"},
{de:"lassen", i:"let", p:"let", pp:"let"},
{de:"lesen", i:"read", p:"read", pp:"read"},
{de:"sprechen", i:"speak", p:"spoke", pp:"spoken"},
{de:"essen", i:"eat", p:"ate", pp:"eaten"},
{de:"trinken", i:"drink", p:"drank", pp:"drunk"},
{de:"laufen", i:"run", p:"ran", pp:"run"},
{de:"fahren", i:"drive", p:"drove", pp:"driven"}
];

const TOTAL_ROUNDS = 10;
let game = [];
let round = 0;
let score = 0;
let selected = [];

let high = localStorage.getItem("hs") || 0;
document.getElementById("highscore").innerText = high;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}

function typicalMistake(w){
if(w.endsWith("e")) return w+"d";
return w+"ed";
}

function buildOptions(v){
let pool = VERBS.flatMap(x=>[x.i,x.p,x.pp]);

let similar = shuffle(pool).filter(x=>![v.i,v.p,v.pp].includes(x)).slice(0,3);
let mistakes = [typicalMistake(v.i), typicalMistake(v.p), typicalMistake(v.pp)];

return shuffle([v.i,v.p,v.pp,...similar,...mistakes]).slice(0,9);
}

function next(){
if(round>=TOTAL_ROUNDS){
if(score>high){localStorage.setItem("hs",score);}
alert("Fertig! Punkte: "+score);
location.reload();
return;
}

selected=[];
document.getElementById("result").innerHTML="";

let v = game[round];
document.getElementById("verb").innerText = v.de;
document.getElementById("round").innerText = round+1;

let options = buildOptions(v);

let html="";
options.forEach(o=>{
html+=`<button class="tile" onclick="pick(this,'${o}')">${o}</button>`;
});

document.getElementById("tiles").innerHTML = html;
}

function pick(btn,val){
if(selected.length>=3) return;
btn.classList.add("selected");
selected.push(val);

if(selected.length===3){
let v = game[round];
let correct = [v.i,v.p,v.pp].join()==selected.join();

if(correct){
score+=3;
document.getElementById("result").innerHTML="✅ Richtig (+3)";
}else{
score-=1;
document.getElementById("result").innerHTML="❌ "+v.i+" - "+v.p+" - "+v.pp;
}

document.getElementById("score").innerText = score;
round++;
setTimeout(next,1000);
}
}

game = shuffle(VERBS).slice(0,TOTAL_ROUNDS);
next();
</script>

</body>
</html>
